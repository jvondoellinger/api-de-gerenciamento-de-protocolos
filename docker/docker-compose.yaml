networks:
  rising_helpdesk:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

services:

  # ---------------------------------------------------------------------------
  # MySQL — banco de dados principal
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: rising_helpdesk_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rising_helpdesk

  # ---------------------------------------------------------------------------
  # Redis — cache distribuído (Cache-Aside)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rising_helpdesk_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rising_helpdesk

  # ---------------------------------------------------------------------------
  # API principal — RisingHelpdesk (Spring Boot 4 / Java 17)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./RisingHelpdesk
      dockerfile: Dockerfile
    container_name: rising_helpdesk_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${API_PORT:-8001}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${SPRING_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_REDIS_PORT:-6379}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_DDL_AUTO:-update}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: info,metrics,prometheus,health
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
    ports:
      - "${API_PORT:-8001}:${API_PORT:-8001}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${API_PORT:-8001}/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rising_helpdesk

  # ---------------------------------------------------------------------------
  # Gateway — Spring Cloud Gateway (roteamento e entrada única)
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: rising_helpdesk_gateway
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SERVER_PORT: ${GATEWAY_PORT:-8080}
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: ticket_v1_module
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: ${API_INTERNAL_URL:-http://api:8001}
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/ticket/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_FILTERS_0: StripPrefix=1
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_FILTERS_1: PrefixPath=/api/ticket
    ports:
      - "${GATEWAY_PORT:-8080}:${GATEWAY_PORT:-8080}"
    networks:
      - rising_helpdesk

  # ---------------------------------------------------------------------------
  # Prometheus — coleta de métricas via Spring Actuator
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: rising_helpdesk_prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - rising_helpdesk

  # ---------------------------------------------------------------------------
  # Grafana — dashboards de observabilidade
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: rising_helpdesk_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - rising_helpdesk
