### Server ###
server.port=8080
spring.application.name=rising_helpdesk

### Swagger / Documentação ###
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

### Redis - Caching ####
spring.data.redis.host=localhost
spring.data.redis.port=6379

### Hibernate - Configuration ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

### Database credentials ###
spring.datasource.url=jdbc:mysql://localhost:3306/Rising?createDatabaseIfNotExist=true
spring.datasource.username=rising
spring.datasource.password=123

### Metrics configuration - Prometheus ###
management.metrics.tags.application=rising_helpdesk
management.endpoint.health.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=info,metrics,prometheus,health
management.endpoint.metrics.cache.time-to-live=100ms

### Logs ###
logging.level.org.mariadb.jdbc=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
