<div class="modal-header">
  <h5 class="modal-title fw-bold">Novo Ticket</h5>
  <button class="btn-close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
  @if (error) {
    <div class="alert alert-danger py-2">{{ error }}</div>
  }

  <div class="mb-3">
    <label class="form-label fw-semibold">Título <span class="text-danger">*</span></label>
    <input
      type="text"
      class="form-control"
      placeholder="Ex: Erro ao acessar o sistema de RH"
      [(ngModel)]="title"
      maxlength="200"
    />
  </div>

  <div class="mb-3">
    <label class="form-label fw-semibold">Fila <span class="text-danger">*</span></label>
    <select class="form-select" [(ngModel)]="queueId">
      <option value="">Selecione uma fila...</option>
      @for (q of queues; track q.id) {
        <option [value]="q.id">{{ q.area }} / {{ q.subarea }}</option>
      }
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label fw-semibold">Prazo <span class="text-danger">*</span></label>
    <input type="datetime-local" class="form-control" [(ngModel)]="deadline" />
    <small class="text-muted">Mínimo: amanhã</small>
  </div>
</div>

<div class="modal-footer">
  <button class="btn btn-outline-secondary" (click)="activeModal.dismiss()">Cancelar</button>
  <button class="btn btn-primary fw-semibold" (click)="submit()" [disabled]="!valid || loading">
    @if (loading) { <span class="spinner-border spinner-border-sm me-1"></span> }
    Criar ticket
  </button>
</div>
